project: my-gcp-project
experiment: production-ml-gcp
run_name: xgb_baseline

data:
  dataset: ml_features
  start: "2024-01-01"
  end: "2024-12-31"

model:
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  scale_pos_weight: 10

mlflow_uri: http://localhost:5000
input_path: data/features.parquet
output_path: data/features.parquet
